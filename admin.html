<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración | Tu Voz Cuenta</title><link rel="stylesheet" href="/styles.css"><style>.wrap{max-width:1050px;margin:auto;padding:55px 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.top h1{font-size:42px;letter-spacing:-2px;margin:12px 0}.panel{background:#fff;border:1px solid #e4e8f1;border-radius:14px;padding:25px;margin-top:22px}.login{max-width:430px;margin:45px auto}.case{padding:22px 0;border-bottom:1px solid #e4e8f1}.case h3{margin:8px 0}.case p{white-space:pre-wrap;color:#68758a;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button,.logout{border:0;border-radius:7px;padding:10px 13px;font-weight:750;cursor:pointer}.approve{background:#ddf8eb;color:#127a56}.reject{background:#fff0f1;color:#ad3947}.logout{background:#eef1f8;color:#34405a}.hide{display:none!important}.msg{font-size:12px;color:#68758a}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.panel{padding:18px}}</style></head><body><header><a class="brand" href="/"><span class="mark">TV</span><span>Tu Voz <b>Cuenta</b></span></a><a href="/" class="plain">Ver web ↗</a></header><main class="wrap"><div class="kicker">ZONA PRIVADA</div><div class="top"><h1>Panel de revisión.</h1><button id="logout" class="logout hide">Cerrar sesión</button></div><section id="login-card" class="panel login"><h2>Acceso de administración</h2><p style="font-size:13px;color:#68758a">Introduce la contraseña configurada en Vercel.</p><form id="login-form"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" style="width:100%;margin-top:20px">Entrar</button><p id="login-status" role="status"></p></form></section><section id="cases-card" class="panel hide"><div class="top"><h2>Casos pendientes</h2><button id="refresh" class="logout">Actualizar</button></div><p id="cases-status" class="msg"></p><div id="cases-list"></div></section></main><script src="/admin.js" defer></script></body></html>
